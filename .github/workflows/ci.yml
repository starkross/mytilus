name: CI

on:
  push:
    branches: [main]
  pull_request:

# All jobs must complete green; keeps the gates in CI identical to what
# `task ci` runs locally so contributors get matching signal pre-push.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pretty colors in cargo output even though we redirect to GH log buffers.
  CLICOLOR: 1

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # Formatting — fast feedback. No cargo deps needed; just rustfmt.
  # ──────────────────────────────────────────────────────────────────────
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Picks up nightly + components from rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task fmt:check
        run: task fmt:check

  # ──────────────────────────────────────────────────────────────────────
  # Host-side: unit tests + clippy on the runner's native toolchain
  # (x86_64-unknown-linux-gnu). Tests can't exercise the syscall path —
  # syscall stubs panic with `unimplemented!()` outside aarch64-linux —
  # but they cover all the pure / pointer / struct-layout code, which is
  # the bulk of what we have so far. Real syscall coverage waits for
  # `task test:qemu`.
  # ──────────────────────────────────────────────────────────────────────
  host:
    name: host (test + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate cache from `cross` because the target dir layout
          # differs (host vs aarch64-unknown-linux-mytilus).
          shared-key: host

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task clippy:host
        run: task clippy:host

      - name: task test
        run: task test

  # ──────────────────────────────────────────────────────────────────────
  # Cross-target: aarch64-unknown-linux-mytilus.
  # Validates the real ship target via `cargo check` + `cargo clippy` +
  # `cargo build` against the custom JSON spec, with -Z build-std for
  # the no-prebuilt-sysroot custom target. This is the gate that catches
  # ABI / target-spec / asm regressions before they hit `task build`.
  # ──────────────────────────────────────────────────────────────────────
  cross:
    name: cross (aarch64-unknown-linux-mytilus)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: task check
        run: task check

      - name: task clippy
        run: task clippy

      - name: task build
        run: task build

  # ──────────────────────────────────────────────────────────────────────
  # Integration: build runc dynamically linked against mytilus libc only.
  # We intentionally force external linking and inject mytilus crt objects,
  # libc.so, and PT_INTERP (`/lib/ld-musl-aarch64.so.1`) from this repo.
  #
  # Notes:
  # - This is a cross-build (linux/arm64) on ubuntu-latest.
  # - We disable runc's seccomp tag here to avoid pulling libseccomp.
  # - Final ELF checks assert no glibc loader/soname dependency slips in.
  # ──────────────────────────────────────────────────────────────────────
  runc-mytilus-dynamic:
    name: runc (dynamic, mytilus libc only)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: runc-mytilus

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cross toolchain utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Build + stage mytilus sysroot
        run: |
          task install PREFIX="$RUNNER_TEMP/mytilus-sysroot"

          SYSROOT="$RUNNER_TEMP/mytilus-sysroot"
          # musl convention: loader soname path for aarch64.
          ln -sf libc.so "$SYSROOT/lib/ld-musl-aarch64.so.1"

          # Go/cgo can request these via -l<name>; in musl they are aliases.
          for lib in pthread dl m rt util crypt resolv; do
            ln -sf libc.so "$SYSROOT/lib/lib${lib}.so"
          done

      - name: Build runc for linux/arm64 against mytilus libc.so
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '1'
          CC: aarch64-linux-gnu-gcc
        run: |
          set -euxo pipefail
          SYSROOT="$RUNNER_TEMP/mytilus-sysroot"

          git clone --depth 1 https://github.com/opencontainers/runc.git
          cd runc

          make runc \
            RUNC_BUILDTAGS='-seccomp' \
            EXTRA_FLAGS='-mod=vendor' \
            EXTRA_LDFLAGS="-linkmode external -extld=${CC} -extldflags '-nostdlib -pie ${SYSROOT}/lib/Scrt1.o ${SYSROOT}/lib/crti.o -L${SYSROOT}/lib -Wl,--dynamic-linker=/lib/ld-musl-aarch64.so.1 -Wl,-rpath,/lib -lc -lgcc ${SYSROOT}/lib/crtn.o'"

      - name: Verify ELF is dynamically linked to mytilus (no glibc/musl deps)
        run: |
          set -euxo pipefail
          BIN="runc/runc"

          file "$BIN"
          aarch64-linux-gnu-readelf -lW "$BIN"
          aarch64-linux-gnu-readelf -dW "$BIN"

          # Must use our loader path.
          aarch64-linux-gnu-readelf -lW "$BIN" | grep -E '/lib/ld-musl-aarch64.so.1'
          # Must depend on plain libc.so from our sysroot (and nothing else).
          needed="$(aarch64-linux-gnu-readelf -dW "$BIN" | sed -n 's/.*Shared library: \[\(.*\)\].*/\1/p' | sort -u)"
          test "$needed" = "libc.so"

          # Must not pull glibc/ld-linux or foreign musl sonames.
          ! aarch64-linux-gnu-readelf -dW "$BIN" | grep -E 'libc\.so\.6|ld-linux|musl\.so\.1|libgcc_s\.so\.1'

      - name: Upload runc artifact
        uses: actions/upload-artifact@v4
        with:
          name: runc-linux-arm64-mytilus-dynamic
          path: runc/runc
